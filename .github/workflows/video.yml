
name: Make video
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core ffmpeg
          pip install edge-tts requests
      - run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            out/caption.txt
      - name: Save topic history
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.json
          git commit -m "update topics" || true
          git push
